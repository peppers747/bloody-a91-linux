name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe
        run: |
          python3 -m py_compile main.py src/*.py
          bash -n install.sh uninstall.sh packaging/build-deb.sh

      - name: Gerar pacote .deb
        run: bash packaging/build-deb.sh

      - name: Testar instalação do .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/*.deb
          bloodylinux --version
          python3 -c "import sys; sys.path.insert(0, '/opt/bloodylinux/vendor'); sys.path.insert(0, '/opt/bloodylinux'); import src.gui, src.input_engine, src.hardware_usb, evdev, usb"

      - name: Gerar pacote .tar.gz (instalador universal)
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)
          NAME="bloodylinux-${VERSION}"
          mkdir -p "build/${NAME}"
          cp -r src main.py requirements.txt LICENSE README.md install.sh uninstall.sh 70-bloodylinux.rules packaging "build/${NAME}/"
          find "build/${NAME}" -name '__pycache__' -prune -exec rm -rf {} +
          tar -C build -czf "dist/${NAME}.tar.gz" "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: bloodylinux-pacotes
          path: dist/*

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
